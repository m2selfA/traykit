[package]
name = "traykit"
version = "0.3.3"
edition = "2024"
description = "A quiet Windows tray toolbox with in-memory clipboard image repair"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
clipboard-win = { version = "5.4", features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
windui = { version = "=0.33.0", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
    "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_LibraryLoader",
    "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
